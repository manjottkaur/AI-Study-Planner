<!DOCTYPE html>
<html>
<head>
    <title>AI Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<div class="container">

<h1>AI Study Planner</h1>

<form action="/predict" method="POST">

<label>Subject</label>

<select name="subject">

{% for subject in subjects %}
<option value="{{subject}}">{{subject}}</option>
{% endfor %}

</select>

<label>Academic Level</label>

<select name="academic">

{% for level in academics %}
<option value="{{level}}">{{level}}</option>
{% endfor %}

</select>

<label> Previous Exam Score</label>

<input type="number"
name="exam_score"
min="0"
max="100"
required>

<label>Days Left for Exam</label>

<input
type="number"
name="days_left"
required>

<label>Available Hours Per Day</label>

<input
type="number"
step="0.5"
name="available_hours"
required>

<label>Difficulty Level (1-5)</label>

<input
type="number"
name="difficulty"
min="1"
max="5"
required>

<br><br>

<button type="submit">

Generate Study Plan

</button>

</form>

{% if prediction %}

<h2>

Recommended Study Hours :

{{prediction}}

</h2>

{% endif %}

</div>

</body>
</html>
